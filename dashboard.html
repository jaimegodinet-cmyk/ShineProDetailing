<style>
  :root {
    --ink: #f2f1ed;
    --panel: #ffffff;
    --panel-2: #f7f6f2;
    --line: #dcdad2;
    --text: #16181c;
    --text-dim: #666b72;
    --gold: #0a0a0a;
    --gold-dim: #d4d4d0;
    --accent-ink: #ffffff;
    --good: #1e8a52;
    --bad: #c23a3a;
    --radius: 10px;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --ink: #121212;
    --panel: #1c1c1c;
    --panel-2: #242424;
    --line: #343434;
    --text: #f0f0ee;
    --text-dim: #9a9da3;
    --gold: #f5f5f2;
    --gold-dim: #3a3a3a;
    --accent-ink: #0a0a0a;
    --good: #6fcf97;
    --bad: #eb6a6a;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #121212;
      --panel: #1c1c1c;
      --panel-2: #242424;
      --line: #343434;
      --text: #f0f0ee;
      --text-dim: #9a9da3;
      --gold: #f5f5f2;
      --gold-dim: #3a3a3a;
      --accent-ink: #0a0a0a;
      --good: #6fcf97;
      --bad: #eb6a6a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.hero {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 3px solid var(--gold);
    padding-bottom: 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .brand h1 span { color: var(--gold); }

  .brand p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  .hero-stat {
    text-align: right;
  }

  .hero-stat .num {
    font-family: var(--font-display);
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
  }

  .hero-stat .lbl {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  section {
    margin-bottom: 36px;
  }

  h2.section-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .add-btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    background: var(--gold);
    color: var(--accent-ink);
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:active { transform: translateY(1px); }

  /* Schedule strip */
  .week-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    overflow-x: auto;
  }

  .day-col {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 8px;
    min-height: 120px;
    min-width: 0;
    cursor: pointer;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }

  .day-col:hover, .day-col:focus-visible {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold) inset;
    outline: none;
  }

  .day-col.today {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold) inset;
  }

  .day-col-hint {
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0;
    margin-top: 6px;
    transition: opacity 0.12s ease;
  }
  .day-col:hover .day-col-hint { opacity: 0.8; }

  /* Quote banner */
  .quote-banner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 24px;
  }
  .quote-banner blockquote {
    margin: 0;
    font-size: 14px;
    font-style: italic;
    color: var(--text);
    flex: 1;
  }
  .quote-banner .quote-refresh {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 13px;
  }
  .quote-banner .quote-refresh:hover { color: var(--text); border-color: var(--gold); }

  /* Estimate stats */
  .estimate-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .estimate-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 10px;
    text-align: center;
  }
  .estimate-card .estimate-num {
    font-family: var(--font-display);
    font-size: clamp(16px, 3.5vw, 22px);
    font-weight: 600;
  }
  .estimate-card .estimate-lbl {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  @media (max-width: 480px) {
    .estimate-row { grid-template-columns: 1fr; }
  }

  .day-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .job {
    background: var(--panel-2);
    border-radius: 6px;
    padding: 6px 7px;
    margin-bottom: 6px;
    font-size: 12px;
    position: relative;
    cursor: default;
  }

  .job .time { color: var(--gold); font-weight: 600; display: block; font-size: 11px; }
  .job .client { font-weight: 600; word-break: break-word; }
  .job .service { color: var(--text-dim); font-size: 11px; word-break: break-word; }

  .job .del {
    position: absolute;
    top: 3px;
    right: 4px;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px;
  }
  .job .del:hover { color: var(--bad); }

  .empty-day {
    color: var(--text-dim);
    font-size: 11px;
    font-style: italic;
    opacity: 0.6;
  }

  /* Profit section */
  .profit-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }

  .chart-wrap {
    width: 100%;
    overflow-x: auto;
  }

  svg#chart { width: 100%; min-width: 480px; height: 220px; display: block; }

  .bar { fill: var(--text-dim); }
  .bar.up { fill: var(--good); }
  .bar.down { fill: var(--bad); }
  .bar:hover { filter: brightness(1.15); }
  .bar-label { fill: var(--text-dim); font-size: 10px; font-family: var(--font-body); }
  .bar-value { fill: var(--text); font-size: 11px; font-weight: 600; font-family: var(--font-body); }
  .axis-line { stroke: var(--line); stroke-width: 1; }
  .trend-line { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0.55; }
  .trend-dot { fill: var(--gold); }

  .profit-list {
    margin-top: 16px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  .profit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
  }
  .profit-row:last-child { border-bottom: none; }

  .profit-row .month { font-weight: 500; }
  .profit-row .amt { font-family: var(--font-display); font-weight: 600; }
  .profit-row .del {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    margin-left: 10px;
  }
  .profit-row .del:hover { color: var(--bad); }

  .empty-state {
    color: var(--text-dim);
    font-size: 13px;
    padding: 14px 0;
    text-align: center;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    max-width: 360px;
  }

  .modal h3 {
    font-family: var(--font-display);
    text-transform: uppercase;
    font-size: 16px;
    margin: 0 0 14px;
    letter-spacing: 0.5px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  .btn-secondary {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .btn-primary {
    background: var(--gold);
    border: none;
    color: var(--accent-ink);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-body);
  }

  footer.note {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 30px;
  }

  @media (max-width: 640px) {
    .week-strip { grid-template-columns: repeat(7, minmax(90px,1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="brand">
      <h1>Shine<span>Pro</span> Detailing</h1>
      <p>Schedule &amp; profit, at a glance</p>
    </div>
    <div class="hero-stat">
      <div class="num" id="heroProfit">$0</div>
      <div class="lbl">this month</div>
    </div>
  </header>

  <div class="quote-banner">
    <blockquote id="quoteText">Loading…</blockquote>
    <button class="quote-refresh" id="quoteRefresh" aria-label="New quote" title="New quote">↻</button>
  </div>

  <section>
    <h2 class="section-title">
      This week
      <button class="add-btn" id="addJobBtn">+ Add appointment</button>
    </h2>
    <div class="week-strip" id="weekStrip"></div>
  </section>

  <section>
    <h2 class="section-title">
      Monthly profit
      <button class="add-btn" id="addProfitBtn">+ Add month</button>
    </h2>
    <div class="profit-panel">
      <div class="estimate-row">
        <div class="estimate-card">
          <div class="estimate-num" id="statAvgMonth">$0</div>
          <div class="estimate-lbl">Avg. monthly profit</div>
        </div>
        <div class="estimate-card">
          <div class="estimate-num" id="statYearEst">$0</div>
          <div class="estimate-lbl">Estimated yearly profit</div>
        </div>
      </div>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 640 220" preserveAspectRatio="xMinYMid meet"></svg>
      </div>
      <div class="profit-list" id="profitList"></div>
    </div>
  </section>

  <footer class="note">Saved privately in this browser · only you can see this · <button id="resetDataBtn" style="background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:0;">Reset all data</button></footer>
</div>

<!-- Job modal -->
<div class="overlay" id="jobOverlay">
  <div class="modal">
    <h3>New appointment</h3>
    <div class="field">
      <label for="jobDay">Day</label>
      <select id="jobDay">
        <option value="0">Sunday</option>
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
      </select>
    </div>
    <div class="field">
      <label for="jobTime">Time</label>
      <input type="time" id="jobTime" value="09:00">
    </div>
    <div class="field">
      <label for="jobClient">Client name</label>
      <input type="text" id="jobClient" placeholder="e.g. Maria Chen">
    </div>
    <div class="field">
      <label for="jobService">Service</label>
      <input type="text" id="jobService" placeholder="e.g. Full interior + wax">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="jobCancel">Cancel</button>
      <button class="btn-primary" id="jobSave">Save</button>
    </div>
  </div>
</div>

<!-- Profit modal -->
<div class="overlay" id="profitOverlay">
  <div class="modal">
    <h3>Add month</h3>
    <div class="field">
      <label for="profitMonth">Month</label>
      <input type="month" id="profitMonth">
    </div>
    <div class="field">
      <label for="profitAmt">Profit ($)</label>
      <input type="number" id="profitAmt" placeholder="e.g. 3200" step="1">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="profitCancel">Cancel</button>
      <button class="btn-primary" id="profitSave">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var STORE_JOBS = 'shinepro_jobs_v1';
  var STORE_PROFIT = 'shinepro_profit_v1';

  function safeGet(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : fallback;
    } catch (e) {
      console.error('storage read failed', e);
      return fallback;
    }
  }

  function safeSet(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      console.error('storage write failed', e);
    }
  }

  var jobs = safeGet(STORE_JOBS, []);
  var profits = safeGet(STORE_PROFIT, []);

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function fmtMoney(n) {
    var neg = n < 0;
    var val = Math.abs(Math.round(n));
    var s = '$' + val.toLocaleString('en-US');
    return neg ? '-' + s : s;
  }

  function fmtTime(t) {
    if (!t) return '';
    var parts = t.split(':');
    var h = parseInt(parts[0], 10);
    var m = parts[1];
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + m + ' ' + ampm;
  }

  function monthLabel(ym) {
    if (!ym) return '';
    var parts = ym.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10) - 1, 1);
    return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
  }

  // ---------- Schedule rendering ----------
  function renderWeek() {
    var strip = document.getElementById('weekStrip');
    strip.innerHTML = '';
    var todayIdx = new Date().getDay();

    for (var d = 0; d < 7; d++) {
      var col = document.createElement('div');
      col.className = 'day-col' + (d === todayIdx ? ' today' : '');
      col.setAttribute('tabindex', '0');
      col.setAttribute('role', 'button');
      col.setAttribute('aria-label', 'Add appointment on ' + DAY_NAMES[d]);
      (function (dayForClick) {
        col.addEventListener('click', function () { openJobModal(dayForClick); });
        col.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openJobModal(dayForClick); }
        });
      })(d);

      var head = document.createElement('div');
      head.className = 'day-head';
      head.textContent = DAY_NAMES[d];
      col.appendChild(head);

      var dayJobs = jobs.filter(function (j) { return j.day === d; })
        .sort(function (a, b) { return (a.time || '').localeCompare(b.time || ''); });

      if (dayJobs.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'empty-day';
        empty.textContent = 'No jobs';
        col.appendChild(empty);
        var hint = document.createElement('div');
        hint.className = 'day-col-hint';
        hint.textContent = '+ tap to add';
        col.appendChild(hint);
      } else {
        dayJobs.forEach(function (j) {
          var card = document.createElement('div');
          card.className = 'job';

          var del = document.createElement('button');
          del.className = 'del';
          del.setAttribute('aria-label', 'Remove appointment');
          del.textContent = '×';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            jobs = jobs.filter(function (x) { return x.id !== j.id; });
            safeSet(STORE_JOBS, jobs);
            renderWeek();
          });
          card.addEventListener('click', function (e) { e.stopPropagation(); });
          card.appendChild(del);

          var time = document.createElement('span');
          time.className = 'time';
          time.textContent = fmtTime(j.time);
          card.appendChild(time);

          var client = document.createElement('div');
          client.className = 'client';
          client.textContent = j.client || 'Untitled';
          card.appendChild(client);

          if (j.service) {
            var svc = document.createElement('div');
            svc.className = 'service';
            svc.textContent = j.service;
            card.appendChild(svc);
          }

          col.appendChild(card);
        });
      }

      strip.appendChild(col);
    }
  }

  // ---------- Profit rendering ----------
  function renderProfit() {
    var sorted = profits.slice().sort(function (a, b) { return a.month.localeCompare(b.month); });
    var list = document.getElementById('profitList');
    list.innerHTML = '';

    if (sorted.length === 0) {
      list.innerHTML = '<div class="empty-state">No months added yet. Add one to start tracking.</div>';
    } else {
      sorted.slice().reverse().forEach(function (p) {
        var row = document.createElement('div');
        row.className = 'profit-row';

        var left = document.createElement('div');
        left.className = 'month';
        left.textContent = monthLabel(p.month);

        var right = document.createElement('div');
        right.style.display = 'flex';
        right.style.alignItems = 'center';

        var amt = document.createElement('span');
        amt.className = 'amt';
        amt.style.color = p.amount >= 0 ? 'var(--good)' : 'var(--bad)';
        amt.textContent = fmtMoney(p.amount);
        right.appendChild(amt);

        var del = document.createElement('button');
        del.className = 'del';
        del.setAttribute('aria-label', 'Remove month');
        del.textContent = '×';
        del.addEventListener('click', function () {
          profits = profits.filter(function (x) { return x.id !== p.id; });
          safeSet(STORE_PROFIT, profits);
          renderProfit();
        });
        right.appendChild(del);

        row.appendChild(left);
        row.appendChild(right);
        list.appendChild(row);
      });
    }

    // Hero stat: most recent month
    var hero = document.getElementById('heroProfit');
    if (sorted.length > 0) {
      var latest = sorted[sorted.length - 1];
      hero.textContent = fmtMoney(latest.amount);
      hero.style.color = latest.amount >= 0 ? 'var(--gold)' : 'var(--bad)';
    } else {
      hero.textContent = '$0';
    }

    drawChart(sorted);
    renderEstimates(sorted);
  }

  function drawChart(sorted) {
    var svg = document.getElementById('chart');
    svg.innerHTML = '';
    var W = 640, H = 220, padL = 10, padR = 10, padB = 30, padT = 20;

    if (sorted.length === 0) {
      var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', W / 2);
      txt.setAttribute('y', H / 2);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('class', 'bar-label');
      txt.textContent = 'Add months to see your profit chart';
      svg.appendChild(txt);
      return;
    }

    var recent = sorted.slice(-12);
    var max = Math.max.apply(null, recent.map(function (p) { return p.amount; }).concat([0]));
    var min = Math.min.apply(null, recent.map(function (p) { return p.amount; }).concat([0]));
    var range = (max - min) || 1;
    var chartH = H - padT - padB;
    var zeroY = padT + chartH * (max / range);

    var axis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    axis.setAttribute('x1', padL); axis.setAttribute('x2', W - padR);
    axis.setAttribute('y1', zeroY); axis.setAttribute('y2', zeroY);
    axis.setAttribute('class', 'axis-line');
    svg.appendChild(axis);

    var n = recent.length;
    var slot = (W - padL - padR) / n;
    var barW = Math.min(46, slot * 0.55);
    var trendPoints = [];

    recent.forEach(function (p, i) {
      var cx = padL + slot * i + slot / 2;
      var barH = Math.abs(p.amount) / range * chartH;
      var y = p.amount >= 0 ? zeroY - barH : zeroY;
      var topY = p.amount >= 0 ? y : y + barH;
      trendPoints.push([cx, topY]);

      var prev = i > 0 ? recent[i - 1].amount : null;
      var dirClass = '';
      if (prev !== null) {
        dirClass = p.amount > prev ? ' up' : (p.amount < prev ? ' down' : '');
      }

      var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', cx - barW / 2);
      rect.setAttribute('y', y);
      rect.setAttribute('width', barW);
      rect.setAttribute('height', Math.max(barH, 1));
      rect.setAttribute('rx', 3);
      rect.setAttribute('class', 'bar' + dirClass);
      svg.appendChild(rect);

      var val = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      val.setAttribute('x', cx);
      val.setAttribute('y', p.amount >= 0 ? y - 6 : y + barH + 14);
      val.setAttribute('text-anchor', 'middle');
      val.setAttribute('class', 'bar-value');
      val.textContent = fmtMoney(p.amount);
      svg.appendChild(val);

      var lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', cx);
      lbl.setAttribute('y', H - 8);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('class', 'bar-label');
      lbl.textContent = monthLabel(p.month);
      svg.appendChild(lbl);
    });

    if (trendPoints.length > 1) {
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      path.setAttribute('points', trendPoints.map(function (pt) { return pt[0] + ',' + pt[1]; }).join(' '));
      path.setAttribute('class', 'trend-line');
      svg.appendChild(path);

      trendPoints.forEach(function (pt) {
        var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', pt[0]);
        dot.setAttribute('cy', pt[1]);
        dot.setAttribute('r', 2.5);
        dot.setAttribute('class', 'trend-dot');
        svg.appendChild(dot);
      });
    }
  }

  function renderEstimates(sorted) {
    var avgEl = document.getElementById('statAvgMonth');
    var yearEstEl = document.getElementById('statYearEst');

    if (sorted.length === 0) {
      avgEl.textContent = '$0';
      yearEstEl.textContent = '$0';
      return;
    }

    var sum = sorted.reduce(function (acc, p) { return acc + p.amount; }, 0);
    var avg = sum / sorted.length;
    var yearEst = avg * 12;

    avgEl.textContent = fmtMoney(avg);
    avgEl.style.color = avg >= 0 ? 'var(--good)' : 'var(--bad)';

    yearEstEl.textContent = fmtMoney(yearEst);
    yearEstEl.style.color = yearEst >= 0 ? 'var(--good)' : 'var(--bad)';
  }

  // ---------- Modals ----------
  var jobOverlay = document.getElementById('jobOverlay');
  var profitOverlay = document.getElementById('profitOverlay');

  function openJobModal(day) {
    document.getElementById('jobClient').value = '';
    document.getElementById('jobService').value = '';
    document.getElementById('jobDay').value = String(typeof day === 'number' ? day : new Date().getDay());
    jobOverlay.classList.add('open');
    document.getElementById('jobClient').focus();
  }

  document.getElementById('addJobBtn').addEventListener('click', function () { openJobModal(); });
  document.getElementById('jobCancel').addEventListener('click', function () {
    jobOverlay.classList.remove('open');
  });
  jobOverlay.addEventListener('click', function (e) { if (e.target === jobOverlay) jobOverlay.classList.remove('open'); });

  document.getElementById('jobSave').addEventListener('click', function () {
    var client = document.getElementById('jobClient').value.trim();
    if (!client) { document.getElementById('jobClient').focus(); return; }
    jobs.push({
      id: uid(),
      day: parseInt(document.getElementById('jobDay').value, 10),
      time: document.getElementById('jobTime').value,
      client: client,
      service: document.getElementById('jobService').value.trim()
    });
    safeSet(STORE_JOBS, jobs);
    renderWeek();
    jobOverlay.classList.remove('open');
  });

  document.getElementById('addProfitBtn').addEventListener('click', function () {
    document.getElementById('profitAmt').value = '';
    var now = new Date();
    var ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('profitMonth').value = ym;
    profitOverlay.classList.add('open');
    document.getElementById('profitAmt').focus();
  });
  document.getElementById('profitCancel').addEventListener('click', function () {
    profitOverlay.classList.remove('open');
  });
  profitOverlay.addEventListener('click', function (e) { if (e.target === profitOverlay) profitOverlay.classList.remove('open'); });

  document.getElementById('profitSave').addEventListener('click', function () {
    var month = document.getElementById('profitMonth').value;
    var amtRaw = document.getElementById('profitAmt').value;
    if (!month || amtRaw === '') return;
    var amount = parseFloat(amtRaw);
    profits = profits.filter(function (p) { return p.month !== month; });
    profits.push({ id: uid(), month: month, amount: amount });
    safeSet(STORE_PROFIT, profits);
    renderProfit();
    profitOverlay.classList.remove('open');
  });

  // ---------- Quotes ----------
  var QUOTES = [
    'A clean car is a first impression you get to control.',
    'Every panel you skip is a panel a customer will notice.',
    'Regulars are built one careful detail job at a time.',
    'Consistency is what turns a one-time client into a standing appointment.',
    "The work you do when no one's watching is what earns the five-star review.",
    "A full schedule means nothing if the margins don't hold — track both.",
    'Word of mouth starts in the parking lot, right after pickup.',
    'Small upsells, done well, add up faster than bigger price tags.',
    'The best marketing is a car that still shines a week later.',
    'Slow months are for sharpening the process, not just waiting them out.'
  ];

  function showRandomQuote() {
    var q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    document.getElementById('quoteText').textContent = q;
  }

  document.getElementById('quoteRefresh').addEventListener('click', showRandomQuote);

  document.getElementById('resetDataBtn').addEventListener('click', function () {
    if (window.confirm('Clear all appointments and profit entries? This can\'t be undone.')) {
      try {
        localStorage.removeItem(STORE_JOBS);
        localStorage.removeItem(STORE_PROFIT);
      } catch (e) {
        console.error('reset failed', e);
      }
      jobs = [];
      profits = [];
      renderWeek();
      renderProfit();
    }
  });

  renderWeek();
  renderProfit();
  showRandomQuote();
})();
</script>
</body>
</html>
